[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-pipeline"
version = "0.3.0"
description = "Training pipeline for CNC machine-failure risk scoring on the AI4I 2020 dataset (DDM501 Assignment 2)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.1,<3",
    "pyyaml>=6.0",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.3,<5",
    "mlflow>=2.17,<3",
    "sqlalchemy>=1.4,<2.1",  # MLflow 2.x breaks on SQLAlchemy 2.1
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
pm-pipeline = "pm_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "dags"]
# MLflow copies the package source into every logged model (code_paths); skip those copies.
extend-exclude = ["mlartifacts", "mlruns", "data/interim", "report/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "N", "SIM", "RUF"]
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
