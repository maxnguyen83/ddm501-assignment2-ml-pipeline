# Experiment matrix. Each entry is one MLflow run. Variables: algorithm, hyperparameters,
# feature set (raw sensors vs raw + physics features) and imbalance handling.
#   imbalance: none | class_weight | undersample | oversample
#   feature_set: raw | physics
experiments:
  - name: E01_rule_toolwear
    model: rule
    feature_set: raw
    imbalance: none
    params: {feature: tool_wear_min}

  - name: E02_logreg_raw
    model: logreg
    feature_set: raw
    imbalance: none
    params: {C: 1.0}

  - name: E03_logreg_raw_cw
    model: logreg
    feature_set: raw
    imbalance: class_weight
    params: {C: 1.0}

  - name: E04_logreg_physics_cw
    model: logreg
    feature_set: physics
    imbalance: class_weight
    params: {C: 1.0}

  - name: E05_rf_raw
    model: random_forest
    feature_set: raw
    imbalance: none
    params: {n_estimators: 300, min_samples_leaf: 2}

  - name: E06_rf_raw_cw
    model: random_forest
    feature_set: raw
    imbalance: class_weight
    params: {n_estimators: 300, min_samples_leaf: 2}

  - name: E07_rf_physics_cw
    model: random_forest
    feature_set: physics
    imbalance: class_weight
    params: {n_estimators: 300, min_samples_leaf: 2}

  - name: E08_rf_physics_under
    model: random_forest
    feature_set: physics
    imbalance: undersample
    params: {n_estimators: 300, min_samples_leaf: 2, target_ratio: 0.33}

  - name: E09_hgb_raw
    model: hist_gb
    feature_set: raw
    imbalance: none
    params: {learning_rate: 0.1, max_iter: 300, max_leaf_nodes: 31}

  - name: E10_hgb_physics
    model: hist_gb
    feature_set: physics
    imbalance: none
    params: {learning_rate: 0.1, max_iter: 300, max_leaf_nodes: 31}

  - name: E11_hgb_physics_cw
    model: hist_gb
    feature_set: physics
    imbalance: class_weight
    params: {learning_rate: 0.1, max_iter: 300, max_leaf_nodes: 31}

  - name: E12_lgbm_physics
    model: lightgbm
    feature_set: physics
    imbalance: none
    params: {n_estimators: 400, learning_rate: 0.05, num_leaves: 15}

  - name: E13_lgbm_physics_over
    model: lightgbm
    feature_set: physics
    imbalance: oversample
    params: {n_estimators: 400, learning_rate: 0.05, num_leaves: 15, target_ratio: 0.33}

  - name: E14_lgbm_raw_cw
    model: lightgbm
    feature_set: raw
    imbalance: class_weight
    params: {n_estimators: 400, learning_rate: 0.05, num_leaves: 15}
